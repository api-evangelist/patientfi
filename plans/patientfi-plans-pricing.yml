note: >-
  TWO CONSUMER LOAN PRODUCTS ARE PUBLISHED WITH REAL RATES AND TERMS; NO API OR PLATFORM
  PRICING IS PUBLISHED AT ALL. PatientFi's public "rates and terms" surface is the Lending
  Partners page, which names the bank partners, states the APR range, and gives worked
  repayment examples — that is the pricing this artifact captures. What is NOT published is
  the other half of the economics: the practice-side processing fee, and any pricing for API
  or enterprise integration. PatientFi's own provider help center says the practice fee
  structure "is established during the underwriting process when your practice first enrolls
  as a PatientFi partner", and there is no /pricing/ page in the site's page sitemap.
