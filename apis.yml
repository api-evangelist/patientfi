aid: patientfi
name: PatientFi
description: >-
  PatientFi is an Irvine, California patient-financing company that lets healthcare practices offer
  patients pay-over-time plans for elective and medical procedures — aesthetics and plastic surgery,
  medspa, cosmetic dental, fertility, audiology and hair restoration. Practices enroll as partnered
  providers, send patients an application link by SMS or from their own website, and issue a
  "transaction" against an approved patient spending limit; the practice is funded within one to
  three business days while the patient repays a bank-originated loan. Approvals reach $60,000
  across the full credit spectrum through a waterfall of bank and credit-union lending partners.
  PatientFi markets "open APIs" for enterprise practice-management integrations and ships native
  in-workflow integrations with Nextech, PatientNow and ModMed plus redirect integrations with
  Symplast and Aesthetic Record, but publishes no public developer portal, API reference or
  machine-readable specification — API access is arranged through an enterprise partnership.
